<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Prix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F7; --ink:#10203A; --muted:#5B6B86; --surface:#FFFFFF;
  --label:#FFD60A; --price:#D90429; --line:#C9D4E3;
  --sans:"Archivo",system-ui,sans-serif; --display:"Archivo Black","Archivo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E1726; --ink:#EAF0F7; --muted:#93A3BE; --surface:#17233A; --line:#2A3A58; --price:#FF4D6A;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:var(--display);font-size:2.2rem;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:12px 16px;font-weight:600;background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--label);outline-offset:2px}
.scan{width:100%;margin-top:10px;font-family:var(--display);font-size:1.1rem;padding:16px;background:var(--label);color:#10203A}
.cam{display:none;margin-top:4px;position:relative;border-radius:10px;overflow:hidden;background:#000}
.cam.on{display:block}
.cam video{width:100%;display:block;max-height:50vh;object-fit:cover}
.cam::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--price);box-shadow:0 0 12px var(--price)}
.manual{display:flex;gap:8px;margin:16px 0}
.manual input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
#msg{min-height:1.5em;color:var(--muted);margin:8px 0}
#msg.err{color:var(--price)}
.product{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.product img{width:72px;height:72px;object-fit:contain;border-radius:6px;background:#fff}
.product h2{margin:0;font-size:1.1rem}
.product p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.tag{background:var(--label);color:#10203A;border-radius:4px;padding:14px 16px;margin-top:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tag small{display:block;font-weight:600}
.tag .big{font-family:var(--display);font-size:2.6rem;line-height:1;color:#10203A}
.tag .big.none{font-size:1.3rem}
h3{font-size:1rem;margin:24px 0 8px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
li span:last-child{font-weight:600;white-space:nowrap}
li small{display:block;color:var(--muted)}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
form.add input{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
form.add button{grid-column:1/-1}
.empty{color:var(--muted)}
.photo{display:block;text-align:center;margin-top:8px;padding:12px 16px;border-radius:8px;border:2px dashed var(--line);font-weight:600;cursor:pointer}
.photo input{display:none}
.photo:focus-within{outline:3px solid var(--label);outline-offset:2px}
.warn{background:var(--label);color:#10203A;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.hits li{cursor:pointer;justify-content:flex-start;align-items:center}
.hits img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:6px}
.hits li:hover{background:var(--surface)}
.diag{font-size:.8rem;color:var(--muted);margin:6px 0 0;min-height:1.2em}
.linkbtn{background:none;color:var(--muted);text-decoration:underline;padding:4px 0;font-weight:400}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .25s ease-out}
@keyframes fl{from{opacity:.9}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash.go{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Scan Prix</h1>
  <p class="sub">Scanne un code-barres, vois le prix. Même si le magasin n’affiche rien.</p>
  <div class="warn" id="secureWarn" hidden>Ouvre le site avec son lien https (GitHub Pages), pas en ouvrant le fichier directement : sinon la caméra est bloquée.</div>

  <div class="cam on" id="cam"><video id="video" playsinline muted></video><div class="flash" id="flash"></div></div>
  <button class="scan" id="scanBtn" type="button">Scanner</button>
  <p class="diag" id="diag"></p>

  <label class="photo">Ou prends une photo du code
    <input id="photo" type="file" accept="image/*" capture="environment">
  </label>

  <div class="manual">
    <input id="ean" placeholder="Nom du produit ou code-barres" aria-label="Nom du produit ou code-barres">
    <button id="goBtn" type="button">Chercher</button>
  </div>
  <div id="msg" role="status"></div>
  <ul class="hits" id="hits"></ul>
  <button type="button" class="linkbtn" id="testBtn">Tester avec un produit exemple</button>

  <section id="result" hidden>
    <div class="product">
      <img id="pImg" alt="">
      <div><h2 id="pName"></h2><p id="pMeta"></p></div>
    </div>
    <div class="tag">
      <div><small id="tagLabel">Dernier prix connu</small><span class="big" id="tagPrice"></span></div>
      <small id="tagWhere" style="text-align:right"></small>
    </div>

    <h3>Prix de la communauté</h3>
    <ul id="community"></ul>

    <h3>Mes relevés</h3>
    <ul id="mine"></ul>
    <form class="add" id="addForm">
      <input id="newPrice" type="number" step="0.01" min="0" placeholder="Prix en €" required aria-label="Prix en euros">
      <input id="newStore" placeholder="Magasin" required aria-label="Magasin">
      <button type="submit">Enregistrer ce prix</button>
    </form>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = (n, cur) => new Intl.NumberFormat("fr-FR", {style:"currency", currency: cur || "EUR"}).format(n);
const fdate = (d) => d ? new Date(d).toLocaleDateString("fr-FR") : "";

let currentCode = null;
let stream = null;
let busy = false;

function say(text, isErr){ const m = $("msg"); m.textContent = text; m.className = isErr ? "err" : ""; }

/* Bip + vibration */
let audioCtx = null;
function unlockAudio(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch(e){}
}
function beep(){
  try {
    unlockAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = 1800;
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.18);
  } catch(e){}
  if (navigator.vibrate) navigator.vibrate(120);
}

/* ---------- Scanner ---------- */
function closeCam(){
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  $("video").srcObject = null;
  $("cam").classList.remove("on");
  $("scanBtn").textContent = "Scanner un autre produit";
}

function loadZXing(){
  return new Promise((res, rej) => {
    if (window.ZXing) return res();
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s.onload = res; s.onerror = () => rej(new Error("zxing"));
    document.head.appendChild(s);
  });
}

const CAM = {video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}};

function zxingHints(){
  const hints = new Map();
  const F = ZXing.BarcodeFormat;
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.QR_CODE]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  return hints;
}

async function openCam(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    say("Ce navigateur ou cette page bloque la caméra. Utilise « prendre une photo du code » en dessous.", true);
    return false;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia(CAM);
    const video = $("video");
    video.srcObject = stream; await video.play();
    try { await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:"continuous"}]}); } catch(e){}
    $("diag").textContent = "Caméra : " + video.videoWidth + "×" + video.videoHeight;
    $("cam").classList.add("on");
    $("scanBtn").textContent = "Scanner";
    say("Cadre le code-barres, puis appuie sur Scanner.");
    return true;
  } catch (e) {
    stream = null;
    $("scanBtn").textContent = "Ouvrir la caméra";
    if (e && e.name === "NotAllowedError") say("Caméra refusée. Autorise-la dans les réglages du navigateur, puis recharge la page.", true);
    else say("Caméra indisponible (" + (e && e.name || "erreur") + "). Utilise « prendre une photo du code ».", true);
    return false;
  }
}

/* Plusieurs versions de l'image, du plus simple au plus agressif */
function frameVariants(video){
  const W = video.videoWidth, H = video.videoHeight;
  const mk = (sx, sy, sw, sh, scale, gray) => {
    const c = document.createElement("canvas");
    c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
    const x = c.getContext("2d", {willReadFrequently:true});
    x.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
    if (gray) {
      const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
      for (let i = 0; i < p.length; i += 4) {
        let g = 0.299 * p[i] + 0.587 * p[i+1] + 0.114 * p[i+2];
        g = Math.max(0, Math.min(255, (g - 128) * 1.6 + 128));
        p[i] = p[i+1] = p[i+2] = g;
      }
      x.putImageData(d, 0, 0);
    }
    return c;
  };
  const cx = W * 0.1, cy = H * 0.25;
  return [
    mk(0, 0, W, H, 1, false),
    mk(cx, cy, W * 0.8, H * 0.5, 1.5, false),
    mk(0, 0, W, H, 1, true),
    mk(cx, cy, W * 0.8, H * 0.5, 2, true)
  ];
}

const FORMATS = ["ean_13","ean_8","upc_a","upc_e","code_128","qr_code"];
let enginePromise = null;
function getEngine(){
  if (!enginePromise) enginePromise = (async () => {
    if ("BarcodeDetector" in window) {
      try {
        const sup = await BarcodeDetector.getSupportedFormats();
        if (sup.includes("ean_13")) return {name:"natif", det:new BarcodeDetector({formats:FORMATS.filter((f) => sup.includes(f))})};
      } catch(e){}
    }
    const m = await import("https://cdn.jsdelivr.net/npm/barcode-detector@3.2.1/dist/es/ponyfill.min.js");
    return {name:"zxing-wasm", det:new m.BarcodeDetector({formats:FORMATS})};
  })().catch((e) => { enginePromise = null; throw e; });
  return enginePromise;
}

async function decodeCanvas(c){
  try {
    const eng = await getEngine();
    $("diag").textContent = "Moteur : " + eng.name + " · image " + c.width + "×" + c.height;
    const r = await eng.det.detect(c);
    if (r.length) return r[0].rawValue;
    return null;
  } catch(e){
    $("diag").textContent = "Moteur principal en erreur, essai du moteur de secours…";
    try {
      await loadZXing();
      const reader = new ZXing.BrowserMultiFormatReader(zxingHints());
      return (await reader.decodeFromImageUrl(c.toDataURL("image/png"))).getText();
    } catch(e2){ return null; }
  }
}

async function scanNow(){
  unlockAudio();
  if (busy) return;
  if (!stream) { await openCam(); return; }
  const video = $("video");
  if (!video.videoWidth) return say("La caméra démarre, réessaie dans une seconde.", true);
  busy = true;
  $("scanBtn").disabled = true;
  const fl = $("flash"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
  say("Analyse en cours… ne bouge pas.");
  getEngine().catch(() => {});
  let raw = null;
  try {
    for (let tries = 0; tries < 3 && !raw; tries++) {
      for (const c of frameVariants(video)) { raw = await decodeCanvas(c); if (raw) break; }
      if (!raw) await new Promise((r) => setTimeout(r, 300));
    }
  } catch(e){}
  busy = false;
  $("scanBtn").disabled = false;
  if (raw) { closeCam(); onCode(raw); }
  else say("Aucun code lu. Rapproche-toi (15-20 cm), évite les reflets, attends que l’image soit nette et appuie à nouveau.", true);
}

/* Lecture depuis une photo : marche même quand le flux vidéo pose problème */
async function readPhoto(file){
  if (!file) return;
  say("Lecture de la photo…");
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const raw = await decodeCanvas(c);
    if (raw) onCode(raw); else say("Aucun code lu sur la photo. Rapproche-toi, évite les reflets et réessaie.", true);
  } catch(e){
    say("Impossible de lire cette photo. Réessaie ou tape le nom du produit.", true);
  }
}

/* Décide ce que contient le code lu */
function normalizeEan(d){
  if (d.length === 12) return "0" + d;
  if (d.length === 14 && d[0] === "0") return d.slice(1);
  return d;
}
function onCode(raw){
  beep();
  raw = String(raw).trim();
  if (/^\d{8,14}$/.test(raw)) { $("ean").value = raw; say("Code lu : " + raw); return lookup(raw); }
  const m = raw.match(/\d{8,14}/);
  if (m) { $("ean").value = m[0]; return lookup(m[0]); }
  say("Code lu : « " + raw.slice(0, 80) + " ». Ce n’est pas un code-barres de produit.", true);
}

/* Recherche : code-barres OU nom de produit */
async function search(q){
  q = q.trim();
  if (!q) return;
  $("hits").innerHTML = "";
  if (/^\d{8,14}$/.test(q)) return lookup(q);
  say("Recherche de « " + q + " »…");
  try {
    const r = await fetch("https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=8&fields=code,product_name,brands,image_front_small_url&search_terms=" + encodeURIComponent(q));
    const j = await r.json();
    const items = (j.products || []).filter((p) => p.code && p.product_name);
    if (!items.length) return say("Aucun produit trouvé pour « " + q + " ».", true);
    say("Choisis ton produit :");
    $("hits").innerHTML = items.map((p) => `<li tabindex="0" data-code="${esc(p.code)}">${p.image_front_small_url ? `<img src="${esc(p.image_front_small_url)}" alt="">` : ""}<span>${esc(p.product_name)}<small>${esc(p.brands || "")}</small></span></li>`).join("");
  } catch(e){ say("Pas de connexion à la base de produits. Réessaie dans un instant.", true); }
}

/* ---------- Données ---------- */
const storeKey = (c) => "scanprix:" + c;
const getMine = (c) => { try { return JSON.parse(localStorage.getItem(storeKey(c))) || []; } catch(e){ return []; } };
const setMine = (c, list) => { try { localStorage.setItem(storeKey(c), JSON.stringify(list)); } catch(e){} };

async function lookup(code){
  code = normalizeEan(String(code).replace(/\D/g, ""));
  if (code.length < 8) return say("Un code-barres a 8 à 13 chiffres.", true);
  $("hits").innerHTML = "";
  currentCode = code;
  say("Recherche en cours…");
  $("result").hidden = true;

  let product = null, prices = [];
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,quantity,image_front_small_url`);
    const j = await r.json();
    if (j.status === 1) product = j.product;
  } catch(e){}
  try {
    const r = await fetch(`https://prices.openfoodfacts.org/api/v1/prices?product_code=${code}&order_by=-date&size=8`);
    const j = await r.json();
    prices = j.items || [];
  } catch(e){}

  if (!product && !prices.length && !getMine(code).length) {
    say("Produit inconnu. Tu peux quand même enregistrer son prix ci-dessous.", false);
  } else { say(""); }

  render(code, product, prices);
}

function render(code, product, prices){
  $("result").hidden = false;
  $("pName").textContent = (product && product.product_name) || "Produit " + code;
  $("pMeta").textContent = product ? [product.brands, product.quantity].filter(Boolean).join(" · ") : code;
  const img = $("pImg");
  if (product && product.image_front_small_url) { img.src = product.image_front_small_url; img.hidden = false; } else { img.hidden = true; }

  const mine = getMine(code);
  const all = [
    ...prices.map((p) => ({price:p.price, cur:p.currency, date:p.date, store:(p.location && (p.location.osm_name || p.location.osm_address_city)) || "Magasin inconnu"})),
    ...mine.map((m) => ({price:m.price, cur:"EUR", date:m.date, store:m.store}))
  ].sort((a, b) => new Date(b.date) - new Date(a.date));

  const big = $("tagPrice");
  if (all.length) {
    big.textContent = eur(all[0].price, all[0].cur); big.className = "big";
    $("tagWhere").textContent = all[0].store + " · " + fdate(all[0].date);
  } else {
    big.textContent = "Pas encore de prix"; big.className = "big none";
    $("tagWhere").textContent = "Ajoute le premier";
  }

  $("community").innerHTML = prices.length
    ? prices.map((p) => `<li><span>${esc((p.location && (p.location.osm_name || p.location.osm_address_city)) || "Magasin inconnu")}<small>${esc(fdate(p.date))}</small></span><span>${esc(eur(p.price, p.currency))}</span></li>`).join("")
    : `<li class="empty">Aucun prix de la communauté pour ce produit.</li>`;

  $("mine").innerHTML = mine.length
    ? mine.slice().reverse().map((m) => `<li><span>${esc(m.store)}<small>${esc(fdate(m.date))}</small></span><span>${esc(eur(m.price))}</span></li>`).join("")
    : `<li class="empty">Aucun relevé de ta part.</li>`;
}

/* ---------- Événements ---------- */
$("scanBtn").addEventListener("click", scanNow);
$("testBtn").addEventListener("click", () => { $("ean").value = "3017620422003"; lookup("3017620422003"); });
if (window.isSecureContext) openCam();
$("goBtn").addEventListener("click", () => search($("ean").value));
$("photo").addEventListener("change", (e) => { readPhoto(e.target.files[0]); e.target.value = ""; });
$("hits").addEventListener("click", (e) => { const li = e.target.closest("li[data-code]"); if (li) lookup(li.dataset.code); });
$("hits").addEventListener("keydown", (e) => { if (e.key === "Enter") { const li = e.target.closest("li[data-code]"); if (li) lookup(li.dataset.code); } });
if (!window.isSecureContext) $("secureWarn").hidden = false;
$("ean").addEventListener("keydown", (e) => { if (e.key === "Enter") search($("ean").value); });
$("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!currentCode) return;
  const price = parseFloat($("newPrice").value);
  const store = $("newStore").value.trim();
  if (!(price >= 0) || !store) return;
  const list = getMine(currentCode);
  list.push({price, store, date: new Date().toISOString().slice(0, 10)});
  setMine(currentCode, list);
  $("newPrice").value = "";
  lookup(currentCode);
});
</script>
</body>
</html>
