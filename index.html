<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Prix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F7; --ink:#10203A; --muted:#5B6B86; --surface:#FFFFFF;
  --label:#FFD60A; --price:#D90429; --line:#C9D4E3;
  --sans:"Archivo",system-ui,sans-serif; --display:"Archivo Black","Archivo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E1726; --ink:#EAF0F7; --muted:#93A3BE; --surface:#17233A; --line:#2A3A58; --price:#FF4D6A;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:var(--display);font-size:2.2rem;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:12px 16px;font-weight:600;background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--label);outline-offset:2px}
.scan{width:100%;font-family:var(--display);font-size:1.1rem;padding:16px;background:var(--label);color:#10203A}
.cam{display:none;margin-top:12px;position:relative;border-radius:10px;overflow:hidden;background:#000}
.cam.on{display:block}
.cam video{width:100%;display:block;max-height:50vh;object-fit:cover}
.cam::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--price);box-shadow:0 0 12px var(--price)}
.manual{display:flex;gap:8px;margin:16px 0}
.manual input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
#msg{min-height:1.5em;color:var(--muted);margin:8px 0}
#msg.err{color:var(--price)}
.product{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.product img{width:72px;height:72px;object-fit:contain;border-radius:6px;background:#fff}
.product h2{margin:0;font-size:1.1rem}
.product p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.tag{background:var(--label);color:#10203A;border-radius:4px;padding:14px 16px;margin-top:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tag small{display:block;font-weight:600}
.tag .big{font-family:var(--display);font-size:2.6rem;line-height:1;color:#10203A}
.tag .big.none{font-size:1.3rem}
h3{font-size:1rem;margin:24px 0 8px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
li span:last-child{font-weight:600;white-space:nowrap}
li small{display:block;color:var(--muted)}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
form.add input{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
form.add button{grid-column:1/-1}
.empty{color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Scan Prix</h1>
  <p class="sub">Scanne un code-barres, vois le prix. Même si le magasin n’affiche rien.</p>

  <button class="scan" id="scanBtn" type="button">Scanner un produit</button>
  <div class="cam" id="cam"><video id="video" playsinline muted></video></div>

  <div class="manual">
    <input id="ean" inputmode="numeric" placeholder="Ou tape le code-barres" aria-label="Code-barres">
    <button id="goBtn" type="button">Chercher</button>
  </div>
  <div id="msg" role="status"></div>

  <section id="result" hidden>
    <div class="product">
      <img id="pImg" alt="">
      <div><h2 id="pName"></h2><p id="pMeta"></p></div>
    </div>
    <div class="tag">
      <div><small id="tagLabel">Dernier prix connu</small><span class="big" id="tagPrice"></span></div>
      <small id="tagWhere" style="text-align:right"></small>
    </div>

    <h3>Prix de la communauté</h3>
    <ul id="community"></ul>

    <h3>Mes relevés</h3>
    <ul id="mine"></ul>
    <form class="add" id="addForm">
      <input id="newPrice" type="number" step="0.01" min="0" placeholder="Prix en €" required aria-label="Prix en euros">
      <input id="newStore" placeholder="Magasin" required aria-label="Magasin">
      <button type="submit">Enregistrer ce prix</button>
    </form>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = (n, cur) => new Intl.NumberFormat("fr-FR", {style:"currency", currency: cur || "EUR"}).format(n);
const fdate = (d) => d ? new Date(d).toLocaleDateString("fr-FR") : "";

let currentCode = null;
let stopFn = null;

function say(text, isErr){ const m = $("msg"); m.textContent = text; m.className = isErr ? "err" : ""; }

/* ---------- Scanner ---------- */
function stopScan(){
  if (stopFn) { try { stopFn(); } catch(e){} stopFn = null; }
  $("cam").classList.remove("on");
  $("scanBtn").textContent = "Scanner un produit";
}

function loadZXing(){
  return new Promise((res, rej) => {
    if (window.ZXing) return res();
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s.onload = res; s.onerror = () => rej(new Error("zxing"));
    document.head.appendChild(s);
  });
}

async function startScan(){
  if (stopFn) return stopScan();
  say("");
  $("cam").classList.add("on");
  $("scanBtn").textContent = "Arrêter le scan";
  const video = $("video");
  try {
    if ("BarcodeDetector" in window) {
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      video.srcObject = stream; await video.play();
      const det = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
      let run = true;
      (async () => {
        while (run) {
          try { const r = await det.detect(video); if (r.length) { onCode(r[0].rawValue); return; } } catch(e){}
          await new Promise((r) => setTimeout(r, 200));
        }
      })();
      stopFn = () => { run = false; stream.getTracks().forEach((t) => t.stop()); };
    } else {
      await loadZXing();
      const reader = new ZXing.BrowserMultiFormatReader();
      reader.decodeFromConstraints({video:{facingMode:"environment"}}, video, (r) => { if (r) onCode(r.getText()); });
      stopFn = () => reader.reset();
    }
  } catch (e) {
    stopScan();
    say("Impossible d’ouvrir la caméra. Autorise l’accès, ou tape le code-barres à la main.", true);
  }
}

function onCode(code){ stopScan(); $("ean").value = code; lookup(code); }

/* ---------- Données ---------- */
const storeKey = (c) => "scanprix:" + c;
const getMine = (c) => { try { return JSON.parse(localStorage.getItem(storeKey(c))) || []; } catch(e){ return []; } };
const setMine = (c, list) => { try { localStorage.setItem(storeKey(c), JSON.stringify(list)); } catch(e){} };

async function lookup(code){
  code = String(code).replace(/\D/g, "");
  if (code.length < 8) return say("Un code-barres a 8 à 13 chiffres.", true);
  currentCode = code;
  say("Recherche en cours…");
  $("result").hidden = true;

  let product = null, prices = [];
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,quantity,image_front_small_url`);
    const j = await r.json();
    if (j.status === 1) product = j.product;
  } catch(e){}
  try {
    const r = await fetch(`https://prices.openfoodfacts.org/api/v1/prices?product_code=${code}&order_by=-date&size=8`);
    const j = await r.json();
    prices = j.items || [];
  } catch(e){}

  if (!product && !prices.length && !getMine(code).length) {
    say("Produit inconnu. Tu peux quand même enregistrer son prix ci-dessous.", false);
  } else { say(""); }

  render(code, product, prices);
}

function render(code, product, prices){
  $("result").hidden = false;
  $("pName").textContent = (product && product.product_name) || "Produit " + code;
  $("pMeta").textContent = product ? [product.brands, product.quantity].filter(Boolean).join(" · ") : code;
  const img = $("pImg");
  if (product && product.image_front_small_url) { img.src = product.image_front_small_url; img.hidden = false; } else { img.hidden = true; }

  const mine = getMine(code);
  const all = [
    ...prices.map((p) => ({price:p.price, cur:p.currency, date:p.date, store:(p.location && (p.location.osm_name || p.location.osm_address_city)) || "Magasin inconnu"})),
    ...mine.map((m) => ({price:m.price, cur:"EUR", date:m.date, store:m.store}))
  ].sort((a, b) => new Date(b.date) - new Date(a.date));

  const big = $("tagPrice");
  if (all.length) {
    big.textContent = eur(all[0].price, all[0].cur); big.className = "big";
    $("tagWhere").textContent = all[0].store + " · " + fdate(all[0].date);
  } else {
    big.textContent = "Pas encore de prix"; big.className = "big none";
    $("tagWhere").textContent = "Ajoute le premier";
  }

  $("community").innerHTML = prices.length
    ? prices.map((p) => `<li><span>${esc((p.location && (p.location.osm_name || p.location.osm_address_city)) || "Magasin inconnu")}<small>${esc(fdate(p.date))}</small></span><span>${esc(eur(p.price, p.currency))}</span></li>`).join("")
    : `<li class="empty">Aucun prix de la communauté pour ce produit.</li>`;

  $("mine").innerHTML = mine.length
    ? mine.slice().reverse().map((m) => `<li><span>${esc(m.store)}<small>${esc(fdate(m.date))}</small></span><span>${esc(eur(m.price))}</span></li>`).join("")
    : `<li class="empty">Aucun relevé de ta part.</li>`;
}

/* ---------- Événements ---------- */
$("scanBtn").addEventListener("click", startScan);
$("goBtn").addEventListener("click", () => lookup($("ean").value));
$("ean").addEventListener("keydown", (e) => { if (e.key === "Enter") lookup($("ean").value); });
$("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!currentCode) return;
  const price = parseFloat($("newPrice").value);
  const store = $("newStore").value.trim();
  if (!(price >= 0) || !store) return;
  const list = getMine(currentCode);
  list.push({price, store, date: new Date().toISOString().slice(0, 10)});
  setMine(currentCode, list);
  $("newPrice").value = "";
  lookup(currentCode);
});
</script>
</body>
</html>
